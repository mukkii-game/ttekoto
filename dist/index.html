<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eff5fc">
  <title>…ってコト⁉︎</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game">
    <header>
      <span>ふしぎな りょうしの おはなし</span>
      <button id="sound" aria-label="おとを きりかえる" aria-pressed="true">おと あり</button>
    </header>

    <div class="heading">
      <h1>…ってコト<span>⁉︎</span></h1>
      <span class="badge">りょうし</span>
    </div>

    <div id="progress" aria-label="おさらいの すすみぐあい"></div>

    <section class="scene" id="scene" data-visual="interference">
      <div class="lesson-characters">
        <img src="./assets/pair.png" alt="ふたりの こ">
      </div>

      <div class="experiment" role="img" aria-label="ふたつの スリットと でんしの ちゃくちする ばしょ">
        <svg viewBox="0 0 420 210" aria-hidden="true">
          <defs>
            <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
              <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
            </filter>
          </defs>

          <g class="beam">
            <circle class="source" cx="32" cy="105" r="8"></circle>
            <path d="M43 105 C78 105 102 82 142 82"></path>
            <path d="M43 105 C78 105 102 128 142 128"></path>
          </g>

          <g class="barrier">
            <rect x="148" y="12" width="15" height="59" rx="7"></rect>
            <rect x="148" y="91" width="15" height="28" rx="7"></rect>
            <rect x="148" y="139" width="15" height="59" rx="7"></rect>
          </g>

          <g class="after-slits">
            <path d="M163 81 C222 79 265 56 335 42"></path>
            <path d="M163 81 C222 88 275 100 335 105"></path>
            <path d="M163 129 C222 122 275 110 335 105"></path>
            <path d="M163 129 C222 131 265 154 335 168"></path>
          </g>

          <g class="detectors">
            <circle cx="156" cy="81" r="15"></circle>
            <circle cx="156" cy="129" r="15"></circle>
            <circle cx="156" cy="81" r="4"></circle>
            <circle cx="156" cy="129" r="4"></circle>
          </g>

          <rect class="screen" x="339" y="10" width="25" height="190" rx="12"></rect>

          <g class="interference" filter="url(#glow)">
            <ellipse cx="351" cy="31" rx="6" ry="5"></ellipse>
            <ellipse cx="351" cy="51" rx="9" ry="7"></ellipse>
            <ellipse cx="351" cy="75" rx="5" ry="4"></ellipse>
            <ellipse cx="351" cy="105" rx="11" ry="9"></ellipse>
            <ellipse cx="351" cy="135" rx="5" ry="4"></ellipse>
            <ellipse cx="351" cy="159" rx="9" ry="7"></ellipse>
            <ellipse cx="351" cy="179" rx="6" ry="5"></ellipse>
          </g>

          <g class="two-bands" filter="url(#glow)">
            <ellipse cx="351" cy="76" rx="10" ry="24"></ellipse>
            <ellipse cx="351" cy="134" rx="10" ry="24"></ellipse>
          </g>

          <g class="record-mark">
            <path d="M178 53 C210 25 254 25 282 52"></path>
            <circle cx="286" cy="55" r="8"></circle>
          </g>

          <g class="eraser-mark">
            <path d="M193 43 L287 166"></path>
            <path d="M287 43 L193 166"></path>
          </g>

          <g class="time-mark">
            <path d="M324 188 C270 205 218 201 181 172"></path>
            <path d="M182 172 L188 188 M182 172 L199 173"></path>
          </g>

          <g class="possibility-cloud">
            <path class="thought-line" d="M210 189 C165 166 116 157 82 137 M210 189 C210 162 210 147 210 132 M210 189 C255 166 304 157 338 137"></path>
            <circle class="thought-dot" cx="210" cy="188" r="6"></circle>
            <circle class="thought-dot" cx="210" cy="170" r="4"></circle>

            <g class="dish curry">
              <ellipse cx="82" cy="105" rx="56" ry="28"></ellipse>
              <path d="M42 105 C58 82 105 81 122 105 C105 126 59 128 42 105"></path>
              <circle cx="67" cy="101" r="7"></circle>
              <circle cx="92" cy="112" r="6"></circle>
            </g>

            <g class="dish rice">
              <ellipse cx="210" cy="116" rx="55" ry="18"></ellipse>
              <path d="M173 113 L210 52 L247 113 Z"></path>
              <rect x="198" y="91" width="24" height="25" rx="4"></rect>
            </g>

            <g class="dish bowl">
              <ellipse cx="338" cy="91" rx="53" ry="17"></ellipse>
              <path d="M287 92 Q338 158 389 92 Z"></path>
              <path d="M308 68 C298 55 320 46 310 32 M340 68 C330 55 352 46 342 32 M369 68 C359 55 381 46 371 32"></path>
            </g>
          </g>

          <g class="single-experiment">
            <rect class="single-cover" x="145" y="116" width="21" height="26" rx="8"></rect>
            <path class="single-path" d="M163 81 C224 80 280 92 337 105"></path>
            <ellipse class="single-band" cx="351" cy="105" rx="10" ry="43"></ellipse>
          </g>
        </svg>
      </div>

      <div class="scene-caption">
        <span id="step-label">なぞ いち</span>
        <span id="caption">ひとつずつ とばす</span>
      </div>
    </section>

    <section class="dialogue" aria-live="polite">
      <h2 class="ending-title" hidden></h2>
      <p id="line"></p>
      <button id="skip" aria-label="ぶんしょうを すべて みせる">▼</button>
    </section>

    <div id="choices"></div>

    <footer>
      <div class="footer-actions">
        <button id="restart">はじめから</button>
        <button id="back">ひとつもどる</button>
      </div>
      <span id="collection">なぞ いち / じゅうに</span>
    </footer>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
