<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eff5fc">
  <title>…ってコト⁉︎</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game">
    <header>
      <span>不思議な量子のお話</span>
      <button id="sound" aria-label="音を切り替える" aria-pressed="true">音あり</button>
    </header>

    <div class="heading">
      <h1>…ってコト<span>⁉︎</span></h1>
      <span class="badge">量子</span>
    </div>

    <div id="progress" aria-label="おさらいの進み具合"></div>

    <section class="scene" id="scene" data-visual="interference">
      <div class="lesson-characters">
        <img src="./assets/pair.png" alt="二人の子">
      </div>

      <div class="experiment" role="img" aria-label="二つのスリットと電子の着地点">
        <svg viewBox="0 0 420 210" aria-hidden="true">
          <defs>
            <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
              <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
            </filter>
          </defs>

          <g class="beam">
            <circle class="source" cx="32" cy="105" r="8"></circle>
            <path d="M43 105 C78 105 102 82 142 82"></path>
            <path d="M43 105 C78 105 102 128 142 128"></path>
          </g>

          <g class="barrier">
            <rect x="148" y="12" width="15" height="59" rx="7"></rect>
            <rect x="148" y="91" width="15" height="28" rx="7"></rect>
            <rect x="148" y="139" width="15" height="59" rx="7"></rect>
          </g>

          <g class="after-slits">
            <path d="M163 81 C222 79 265 56 335 42"></path>
            <path d="M163 81 C222 88 275 100 335 105"></path>
            <path d="M163 129 C222 122 275 110 335 105"></path>
            <path d="M163 129 C222 131 265 154 335 168"></path>
          </g>

          <g class="detectors">
            <circle cx="156" cy="81" r="15"></circle>
            <circle cx="156" cy="129" r="15"></circle>
            <circle cx="156" cy="81" r="4"></circle>
            <circle cx="156" cy="129" r="4"></circle>
          </g>

          <rect class="screen" x="339" y="10" width="25" height="190" rx="12"></rect>

          <g class="interference" filter="url(#glow)">
            <ellipse cx="351" cy="31" rx="6" ry="5"></ellipse>
            <ellipse cx="351" cy="51" rx="9" ry="7"></ellipse>
            <ellipse cx="351" cy="75" rx="5" ry="4"></ellipse>
            <ellipse cx="351" cy="105" rx="11" ry="9"></ellipse>
            <ellipse cx="351" cy="135" rx="5" ry="4"></ellipse>
            <ellipse cx="351" cy="159" rx="9" ry="7"></ellipse>
            <ellipse cx="351" cy="179" rx="6" ry="5"></ellipse>
          </g>

          <g class="two-bands" filter="url(#glow)">
            <ellipse cx="351" cy="76" rx="10" ry="24"></ellipse>
            <ellipse cx="351" cy="134" rx="10" ry="24"></ellipse>
          </g>

          <g class="record-mark">
            <path d="M178 53 C210 25 254 25 282 52"></path>
            <circle cx="286" cy="55" r="8"></circle>
          </g>

          <g class="eraser-mark">
            <path d="M193 43 L287 166"></path>
            <path d="M287 43 L193 166"></path>
          </g>

          <g class="time-mark">
            <path d="M324 188 C270 205 218 201 181 172"></path>
            <path d="M182 172 L188 188 M182 172 L199 173"></path>
          </g>

          <g class="possibility-cloud">
            <path class="thought-line" d="M210 189 C165 166 116 157 82 137 M210 189 C210 162 210 147 210 132 M210 189 C255 166 304 157 338 137"></path>
            <circle class="thought-dot" cx="210" cy="188" r="6"></circle>
            <circle class="thought-dot" cx="210" cy="170" r="4"></circle>

            <g class="dish curry">
              <ellipse cx="82" cy="105" rx="56" ry="28"></ellipse>
              <path d="M42 105 C58 82 105 81 122 105 C105 126 59 128 42 105"></path>
              <circle cx="67" cy="101" r="7"></circle>
              <circle cx="92" cy="112" r="6"></circle>
            </g>

            <g class="dish rice">
              <ellipse cx="210" cy="116" rx="55" ry="18"></ellipse>
              <path d="M173 113 L210 52 L247 113 Z"></path>
              <rect x="198" y="91" width="24" height="25" rx="4"></rect>
            </g>

            <g class="dish bowl">
              <ellipse cx="338" cy="91" rx="53" ry="17"></ellipse>
              <path d="M287 92 Q338 158 389 92 Z"></path>
              <path d="M308 68 C298 55 320 46 310 32 M340 68 C330 55 352 46 342 32 M369 68 C359 55 381 46 371 32"></path>
            </g>
          </g>

          <g class="single-experiment">
            <rect class="single-cover" x="145" y="116" width="21" height="26" rx="8"></rect>
            <path class="single-path" d="M163 81 C224 80 280 92 337 105"></path>
            <ellipse class="single-band" cx="351" cy="105" rx="10" ry="43"></ellipse>
          </g>

          <g class="pathless-wave">
            <circle class="cloud-source" cx="32" cy="105" r="8"></circle>
            <path class="probability-cloud" d="M42 101 C78 77 109 69 146 73 L146 89 C109 89 78 103 42 109 Z"></path>
            <path class="probability-cloud" d="M165 74 C225 58 278 55 337 61 L337 149 C278 151 225 115 165 90 Z"></path>
          </g>

          <g class="source-spread">
            <circle class="cloud-source" cx="32" cy="105" r="8"></circle>
            <path class="probability-cloud broad-cloud" d="M42 99 C80 53 112 27 146 18 L146 192 C112 183 80 157 42 111 Z"></path>
            <path class="probability-cloud" d="M165 73 C224 53 280 39 337 36 L337 103 C280 101 224 94 165 89 Z"></path>
            <path class="probability-cloud" d="M165 121 C224 116 280 109 337 107 L337 174 C280 171 224 157 165 137 Z"></path>
            <g class="absorbed-marks">
              <path d="M137 39 L145 47 M145 39 L137 47"></path>
              <path d="M137 101 L145 109 M145 101 L137 109"></path>
              <path d="M137 164 L145 172 M145 164 L137 172"></path>
            </g>
          </g>
        </svg>
      </div>

      <div class="term-guide">
        <div class="term-card amplitude-card" role="img" aria-label="確率振幅は長さと向きのある矢印。二つの矢印を足してから確率に直す">
          <strong>確率振幅</strong>
          <span>長さと向きのある矢印</span>
          <svg viewBox="0 0 360 82" aria-hidden="true">
            <defs>
              <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z"></path></marker>
            </defs>
            <path class="guide-arrow" d="M15 29 H60" marker-end="url(#arrow-blue)"></path>
            <text x="76" y="36">足す</text>
            <path class="guide-arrow" d="M116 29 H161" marker-end="url(#arrow-blue)"></path>
            <text x="176" y="36">なら</text>
            <path class="guide-arrow strong-arrow" d="M229 29 H345" marker-end="url(#arrow-blue)"></path>
            <text class="guide-note" x="180" y="72" text-anchor="middle">まず矢印を足す</text>
          </svg>
        </div>

        <div class="term-card phase-card" role="img" aria-label="位相は矢印の向き。同じ向きなら強くなり、逆向きなら打ち消し合う">
          <strong>位相</strong>
          <span>矢印の向き</span>
          <svg viewBox="0 0 360 96" aria-hidden="true">
            <defs>
              <marker id="arrow-phase" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z"></path></marker>
            </defs>
            <path class="guide-arrow" d="M13 25 H68" marker-end="url(#arrow-phase)"></path>
            <path class="guide-arrow second-arrow" d="M82 25 H137" marker-end="url(#arrow-phase)"></path>
            <text class="guide-note" x="167" y="31">同じ向き</text>
            <text class="guide-result" x="337" y="31" text-anchor="end">強く</text>
            <path class="guide-arrow" d="M13 70 H68" marker-end="url(#arrow-phase)"></path>
            <path class="guide-arrow second-arrow" d="M137 70 H82" marker-end="url(#arrow-phase)"></path>
            <text class="guide-note" x="167" y="76">逆向き</text>
            <text class="guide-result" x="337" y="76" text-anchor="end">打ち消す</text>
          </svg>
        </div>
      </div>

      <div class="scene-caption">
        <span id="step-label">謎 一</span>
        <span id="caption">まだ決まっていない</span>
      </div>
    </section>

    <section class="dialogue" aria-live="polite">
      <h2 class="ending-title" hidden></h2>
      <p id="line"></p>
      <button id="skip" aria-label="文章をすべて見せる">▼</button>
    </section>

    <div id="choices"></div>

    <footer>
      <div class="footer-actions">
        <button id="restart">はじめから</button>
        <button id="back">一つ戻る</button>
      </div>
      <span id="collection">謎 一 / 十四</span>
    </footer>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
